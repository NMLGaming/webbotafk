<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Bot Web Control Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: rgba(18, 26, 43, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-purple: #8b5cf6;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      background: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(59, 130, 246, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.12) 0%, transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
    }

    .logo-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-title i {
      font-size: 28px;
      color: var(--accent-blue);
      filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.6));
    }

    .logo-title h1 {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .host-bar {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      padding: 12px 20px;
      border-radius: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }

    .host-bar input {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      flex: 1;
      font-size: 14px;
      outline: none;
    }

    .host-bar input:focus { border-color: var(--accent-blue); }

    .btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn:hover { transform: translateY(-2px); }
    .btn-green { background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.4); color: #34d399; }
    .btn-red { background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.4); color: #f87171; }
    .btn-blue { background: rgba(59, 130, 246, 0.15); border-color: rgba(59, 130, 246, 0.4); color: #60a5fa; }

    .bot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 20px;
    }

    .bot-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
    }

    .bot-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--accent-green);
      border-radius: 16px 16px 0 0;
    }

    .bot-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .bot-name { font-size: 16px; font-weight: 700; }

    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .cmd-group { display: flex; gap: 6px; }
    .cmd-group input {
      flex: 1;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      outline: none;
    }

    .status-text {
      font-size: 13px;
      color: var(--text-muted);
      padding: 8px 12px;
      background: rgba(0,0,0,0.2);
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-title">
      <i class="fa-solid fa-server"></i>
      <h1>Minecraft Bot Web Controller</h1>
    </div>
  </header>

  <!-- Nhập IP Web Host tại đây -->
  <div class="host-bar">
    <i class="fa-solid fa-network-wired" style="color: var(--accent-blue);"></i>
    <input type="text" id="hostUrl" placeholder="Nhập IP/URL Server (Ví dụ: http://123.45.67.89:3000)">
    <button class="btn btn-blue" onclick="connectHost()"><i class="fa-solid fa-plug"></i> Kết Nối & Kiểm Tra</button>
  </div>

  <div class="bot-grid" id="botGrid">
    <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px 0;">
      Vui lòng nhập IP/URL của Server Node.js vào ô trên rồi nhấn <b>Kết Nối & Kiểm Tra</b>.
    </div>
  </div>

  <script>
    let hostApi = "";

    async function connectHost() {
      let inputUrl = document.getElementById("hostUrl").value.trim();
      if (!inputUrl) return alert("Vui lòng nhập IP Server!");

      if (!inputUrl.startsWith("http://") && !inputUrl.startsWith("https://")) {
        inputUrl = "http://" + inputUrl;
      }
      hostApi = inputUrl.replace(/\/$/, "");

      try {
        const res = await fetch(`${hostApi}/api/accounts`);
        if (!res.ok) throw new Error("Không thể kết nối API");
        const data = await res.json();
        
        renderBots(data.accounts || []);
      } catch (err) {
        alert("Kết nối thất bại! Hãy kiểm tra lại IP hoặc mở Port Server.");
      }
    }

    function renderBots(accounts) {
      const grid = document.getElementById("botGrid");
      grid.innerHTML = "";

      if (accounts.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">Không tìm thấy tài khoản bot nào.</div>`;
        return;
      }

      accounts.forEach(acc => {
        const card = document.createElement("div");
        card.className = "bot-card";

        card.innerHTML = `
          <div class="bot-header">
            <div class="bot-name"><i class="fa-solid fa-robot"></i> ${acc}</div>
            <span class="badge">SẴN SÀNG</span>
          </div>

          <div class="status-text">
            Trạng thái: <b style="color: #34d399;">Đã kết nối Web Host</b>
          </div>

          <div class="cmd-group">
            <input type="text" id="input-${acc}" placeholder="Gõ lệnh chat (.slot, .invclick...)" onkeydown="if(event.key==='Enter') sendChat('${acc}')">
            <button class="btn btn-blue" onclick="sendChat('${acc}')"><i class="fa-solid fa-paper-plane"></i></button>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    async function sendChat(username) {
      const input = document.getElementById(`input-${username}`);
      const msg = input.value.trim();
      if (!msg || !hostApi) return;

      try {
        await fetch(`${hostApi}/api/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, message: msg })
        });
        input.value = "";
      } catch (err) {
        alert("Lỗi gửi lệnh!");
      }
    }
  </script>
</body>
</html>
